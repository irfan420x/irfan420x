  </style>
  <line class="br" x1="0" y1="17" x2="536" y2="17" stroke="url(#dg)" stroke-width="1.6"/>
  <line class="br" x1="664" y1="17" x2="1200" y2="17" stroke="url(#dg)" stroke-width="1.6"/>
  <g transform="translate(600 17)">
    <rect x="-7" y="-7" width="14" height="14" transform="rotate(45)" fill="none" stroke="#a855f7" stroke-opacity="0.9" stroke-width="1.6"/>
    <circle r="2.6" fill="#22d3ee"/>
