    <g clip-path="url(#c1)"><text x="76" y="60" fill="url(#tg)">PURPLE TEAMER</text></g>
    <g clip-path="url(#c2)"><text x="76" y="60" fill="url(#tg)">OFFENSIVE SECURITY RESEARCHER</text></g>
    <g clip-path="url(#c3)"><text x="76" y="60" fill="url(#tg)">ANDROID REVERSE ENGINEER</text></g>
    <g clip-path="url(#c4)"><text x="76" y="60" fill="url(#tg)">AUTOMATION &amp; AI AGENT BUILDER</text></g>
