      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="55%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <clipPath id="c1"><rect x="0" y="0" width="0" height="96"><animate attributeName="width" dur="16s" repeatCount="indefinite" begin="0s"   keyTimes="0;0.02;0.23;0.25;1" values="0;0;236;0;0" calcMode="linear"/></rect></clipPath>
    <clipPath id="c2"><rect x="0" y="0" width="0" height="96"><animate attributeName="width" dur="16s" repeatCount="indefinite" begin="0s"   keyTimes="0;0.25;0.27;0.48;0.50;1" values="0;0;552;552;0;0" calcMode="linear"/></rect></clipPath>
