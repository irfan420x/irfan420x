  <rect width="1200" height="96" rx="14" fill="url(#tbg)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="94.5" rx="14" fill="none" stroke="#a855f7" stroke-opacity="0.26" stroke-width="1.5"/>

