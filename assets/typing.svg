    <clipPath id="c4"><rect x="0" y="0" width="0" height="96"><animate attributeName="width" dur="16s" repeatCount="indefinite" begin="0s"   keyTimes="0;0.75;0.77;0.98;1" values="0;0;552;552;0" calcMode="linear"/></rect></clipPath>
  </defs>

  <style>
