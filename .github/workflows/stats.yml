name: Refresh Stat Cards

# Regenerates assets/{rank,activity,langs}.svg from the GitHub API and commits them.
# NOTE: deliberately NOT triggered on `push` — this job commits to main, so a push
# trigger would loop forever. Schedule + manual dispatch only.
on:
  schedule:
    - cron: "17 3 * * *"      # daily, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/render_stats.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/rank.svg assets/activity.svg assets/langs.svg
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore(stats): refresh stat cards [skip ci]"
            git push
          fi
